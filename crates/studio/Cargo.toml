[package]
name = "hikari-studio"
version = "0.1.0"
edition = "2021"
authors = ["Hikari Contributors"]
description = "Modern standalone 3D animation studio and viewport for PMX and VMD on DirectX 11"
license = "MIT"

[[bin]]
name = "hikari_studio"
path = "src/main.rs"

[dependencies]
hikari-core = { path = "../core" }
hikari-formats = { path = "../formats" }
hikari-animation = { path = "../animation" }
hikari-render = { path = "../render" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
